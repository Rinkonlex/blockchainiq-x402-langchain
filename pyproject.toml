[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blockchainiq-x402-langchain"
version = "0.1.0"
description = "LangChain tool for Blockchain IQ's x402 pay-per-call crypto data API (USDC on Base, no account, no API key)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=0.3",
    "eth-account>=0.13",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["blockchainiq_x402*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
